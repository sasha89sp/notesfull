name: mysecure_notes
description: Защищённые заметки, таблицы, календарь и пароли с синхронизацией по WebDAV
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: ^2.7.0
  path_provider: ^2.1.4
  http: ^1.2.2
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  image: ^4.3.0
  archive: ^3.6.1
  record: ^6.0.0
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  android_intent_plus: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/tray.ico
    - assets/alert.wav
    - assets/icon/icon_512.png
